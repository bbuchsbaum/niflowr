name: Generated Artifact Drift

on:
  pull_request:
    paths:
      - "inst/specs/**"
      - "tools/gen_wrappers.R"
      - "tools/gen_golden_cmdline.R"
      - "tools/check_wrapper_docs.R"
      - "R/wrappers_auto.R"
      - "tests/golden/cmdline_golden.json"
      - "NAMESPACE"
      - "man/**"
      - ".github/workflows/generated-artifact-drift.yml"
  push:
    branches:
      - main
    paths:
      - "inst/specs/**"
      - "tools/gen_wrappers.R"
      - "tools/gen_golden_cmdline.R"
      - "tools/check_wrapper_docs.R"
      - "R/wrappers_auto.R"
      - "tests/golden/cmdline_golden.json"
      - "NAMESPACE"
      - "man/**"
      - ".github/workflows/generated-artifact-drift.yml"

jobs:
  check-generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      # jsonvalidate's V8 backend needs libnode at runtime.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libnode-dev

      # Install the exact packages the codegen scripts need. A plain
      # install.packages() (not pak/DESCRIPTION resolution) avoids the package's
      # non-CRAN Suggests (bidsappr, neuroim2, ...) that cannot be solved here.
      - name: Install R dependencies
        run: install.packages(c("cli", "digest", "fs", "glue", "jsonlite", "jsonvalidate", "processx", "yaml", "pkgload"))
        shell: Rscript {0}

      - name: Regenerate wrappers
        run: Rscript tools/gen_wrappers.R

      - name: Regenerate golden command fixture
        run: Rscript tools/gen_golden_cmdline.R

      - name: Validate generated wrapper docs
        run: Rscript tools/check_wrapper_docs.R

      - name: Fail on generated artifact drift
        run: |
          if ! git diff --quiet -- R/wrappers_auto.R tests/golden/cmdline_golden.json; then
            echo "::error::Generated artifacts are out of date. Regenerate wrappers and command goldens."
            git --no-pager diff -- R/wrappers_auto.R tests/golden/cmdline_golden.json
            exit 1
          fi

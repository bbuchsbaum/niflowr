name: Nipype Spec Drift

on:
  pull_request:
    paths:
      - "inst/specs/**"
      - "inst/schema/**"
      - "tools/import_nipype_specs.py"
      - "tools/nipype_manifest.json"
      - "tools/spec_overrides/**"
      - "R/ni_forge.R"
      - ".github/workflows/nipype-spec-drift.yml"
  push:
    branches:
      - main
    paths:
      - "inst/specs/**"
      - "inst/schema/**"
      - "tools/import_nipype_specs.py"
      - "tools/nipype_manifest.json"
      - "tools/spec_overrides/**"
      - "R/ni_forge.R"
      - ".github/workflows/nipype-spec-drift.yml"

jobs:
  check-spec-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pin nipype: the committed specs are generated against a specific
      # interface set, so an unpinned nipype would drift on every release.
      - name: Install importer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nipype==1.10.0" jsonschema

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      # Only the CRAN packages ni_lint_specs() needs (loaded via pkgload).
      - name: Install R dependencies
        run: install.packages(c("cli", "digest", "fs", "glue", "jsonlite", "jsonvalidate", "processx", "yaml", "pkgload"))
        shell: Rscript {0}

      # Stage 1: import raw interfaces from nipype (with tools/spec_overrides
      # deep-merged for niflowr-only fields the importer can't express).
      - name: Regenerate Nipype specs
        run: |
          python tools/import_nipype_specs.py \
            --discover-root nipype.interfaces.fsl \
            --discover-root nipype.interfaces.afni \
            --discover-root nipype.interfaces.ants \
            --discover-root nipype.interfaces.freesurfer \
            --overwrite \
            --omit-imported-at

      # Stage 2: apply the same normalization that produces the committed specs
      # (shell-argstr rewrites, position-collision and xor cleanup).
      - name: Normalize specs
        run: Rscript -e 'pkgload::load_all("."); ni_lint_specs("inst/specs", fix = TRUE, write = TRUE)'

      - name: Fail on drift
        run: |
          if ! git diff --quiet -- inst/specs; then
            echo "::error::Specs are out of date. Run tools/import_nipype_specs.py then ni_lint_specs(fix=TRUE) and commit."
            git --no-pager diff -- inst/specs
            exit 1
          fi
